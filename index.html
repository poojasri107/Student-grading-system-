<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal Login - SMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .login-card {
            width: 440px;
            padding: 40px !important;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            color: #ffffff;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1.5px solid rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important;
        }
        .form-control:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
        }
    </style>
</head>
<body>
    <div class="card login-card text-center">
        <div class="mb-4">
            <i class="fa-solid fa-graduation-cap fs-1 text-primary mb-2"></i>
            <h2 class="fw-bold tracking-wide m-0 text-white">SMS PORTAL</h2>
            <p class="text-white-50 mt-1 small">Student Management Enterprise System</p>
        </div>

        <div class="text-start">
            <div class="mb-3">
                <label class="form-label text-white-50 small">Email Address</label>
                <input type="email" id="email" class="form-control form-control-lg" placeholder="name@example.com">
            </div>

            <div class="mb-4">
                <label class="form-label text-white-50 small">Secure Password</label>
                <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••">
            </div>

            <button class="btn btn-primary btn-lg w-100 d-flex justify-content-center align-items-center" onclick="login()">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
            </button>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            try {
                const response = await fetch("http://localhost:8080/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.status === "success") {
                    sessionStorage.setItem("isLoggedIn", "true");
                    sessionStorage.setItem("userRole", data.role);
                    sessionStorage.setItem("userEmail", data.email);
                    sessionStorage.setItem("userToken", data.token);

                    alert("Login Successful! Accessing dashboard...");
                    window.location.href = "dashboard.html";
                } else {
                    alert(data.message || "Invalid Username or Password.");
                }
            } catch (error) {
                console.error("Login Error:", error);
                alert("Failed to connect to authentication server. Is Spring Boot running?");
            }
        }
    </script>
</body>
</html>
